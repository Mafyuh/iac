---
# yaml-language-server: $schema=https://schemas.iac.gg/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds
  interval: 1h
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
