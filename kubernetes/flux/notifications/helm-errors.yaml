---
# yaml-language-server: $schema=https://schemas.iac.gg/notification.toolkit.fluxcd.io/alert_v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-helm-errors
  namespace: flux-system
spec:
  eventMetadata:
    summary: Flux Helm Error
  providerRef:
    name: flux-errors
  eventSeverity: error
  eventSources:
    - kind: HelmRepository
      name: "*"
    - kind: HelmRelease
      name: "*"
