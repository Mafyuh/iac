---
# yaml-language-server: $schema=https://schemas.iac.gg/notification.toolkit.fluxcd.io/alert_v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-kustomize-errors
  namespace: flux-system
spec:
  eventMetadata:
    summary: Flux Kustomize Error
  providerRef:
    name: flux-errors
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: "*"
