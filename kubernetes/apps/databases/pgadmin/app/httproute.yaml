---
# yaml-language-server: $schema=https://schemas.iac.gg/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pg-cluster-pgadmin
spec:
  hostnames: ["pgadmin.${NEW_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: kube-system
  rules:
    - backendRefs:
        - name: pg-cluster-pgadmin
          port: 5050
