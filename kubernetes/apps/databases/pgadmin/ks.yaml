---
# yaml-language-server: $schema=https://schemas.iac.gg/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pgadmin
  namespace: &ns databases
spec:
  targetNamespace: *ns
  components:
    - ../../../../components/authentik-proxy
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/databases/pgadmin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: iac
    namespace: flux-system
  wait: false
  dependsOn:
    - name: crunchy-pgo
      namespace: databases
  postBuild:
    substitute:
      APP: pgadmin
      EXT_AUTH_TARGET: pg-cluster-pgadmin
