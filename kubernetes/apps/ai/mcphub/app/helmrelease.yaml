---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcphub
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: mcphub
  values:
    global:
      fullnameOverride: *app
      namespace: ai

    controllers:
      mcphub:
        enabled: true
        type: deployment

        replicas: 1

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: mirror.gcr.io/samanhappy/mcphub
              tag: 1.1.13
              pullPolicy: IfNotPresent
            env:
              TZ: America/New_York
              ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mcphub-secrets
                    key: MCPHUB_ADMIN_PASSWORD
              PG_URI:
                valueFrom:
                  secretKeyRef:
                    name: pg-cluster-pguser-mcphub
                    key: uri
              DB_URL:
                value: $(PG_URI)?sslmode=no-verify
                dependsOn: PG_URI
              BETTER_AUTH_ENABLED: "true"
              BETTER_AUTH_URL: "https://{{ .Release.Name }}.${NEW_DOMAIN}"
              BETTER_AUTH_OIDC_ENABLED: "true"
              BETTER_AUTH_OIDC_DISCOVERY_URL: https://auth.mafyuh.io/application/o/mcphub/.well-known/openid-configuration
              OIDC_CLIENT_ID: "mcphub"
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: mcphub-secrets
                    key: OIDC_CLIENT_SECRET

            probes:
              liveness:
                enabled: false

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 4Gi

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data

    service:
      app:
        primary: true
        controller: mcphub
        ports:
          http:
            port: &port 3000

    route:
      internal:
        enabled: true
        kind: HTTPRoute
        hostnames: ["{{ .Release.Name }}.${NEW_DOMAIN}"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: mcphub
                port: *port
        parentRefs:
          - name: envoy-external
            namespace: kube-system
            sectionName: https
