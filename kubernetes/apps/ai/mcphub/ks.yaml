---
# yaml-language-server: $schema=https://schemas.iac.gg/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mcphub
  namespace: &ns ai
spec:
  components:
    - ../../../../components/volsync
  targetNamespace: *ns
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/ai/mcphub/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: iac
    namespace: flux-system
  wait: false
  postBuild:
    substitute:
      APP: mcphub
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_SCHEDULE: "45 1 * * *"
      VOLSYNC_PUID: "0"
      VOLSYNC_PGID: "0"
