---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kubernetes-mcp
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp
  values:
    controllers:
      kubernetes-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/containers/kubernetes_mcp_server
              tag: v0.1.1
            args:
              - --config
              - /etc/kubernetes-mcp-server/config.toml
            env:
              TZ: America/New_York
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        serviceAccount:
          identifier: *app

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    serviceAccount:
      kubernetes-mcp: {}

    rbac:
      bindings:
        kubernetes-mcp:
          type: ClusterRoleBinding
          roleRef:
            kind: ClusterRole
            name: view
          subjects:
            - identifier: *app

    persistence:
      config:
        type: configMap
        name: kubernetes-mcp-config
        globalMounts:
          - path: /etc/kubernetes-mcp-server/config.toml
            subPath: config.toml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
