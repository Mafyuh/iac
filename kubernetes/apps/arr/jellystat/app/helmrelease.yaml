---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellystat
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  values:
    defaultExternalSecretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden-secrets-manager

    externalSecrets:
      jellystat:
        forceRename: jellystat-secrets
        refreshInterval: 3h
        data:
          - secretKey: POSTGRES_PASSWORD
            remoteRef:
              key: "fda9e7f2-0f6d-4067-ab92-b349013165a1"
          - secretKey: JWT_SECRET
            remoteRef:
              key: "783928df-392a-4ec7-be08-b25b0058752a"
          - secretKey: JS_GEOLITE_LICENSE_KEY
            remoteRef:
              key: "9da192f7-a8b4-4cf9-857f-b34901335ea1"

    controllers:
      jellystat:
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        containers:
          main:
            image:
              repository: ghcr.io/cyfershepard/jellystat
              tag: 1.1.12
            env:
              TZ: America/New_York
              POSTGRES_USER: jellystat
              POSTGRES_IP: pg-cluster-primary.databases.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_DB: jellystat
              JS_GEOLITE_ACCOUNT_ID: "972418"
              MINIMUM_SECONDS_TO_INCLUDE_PLAYBACK: "15"
            envFrom:
              - externalSecretRef:
                  identifier: jellystat
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3000

    route:
      app:
        hostnames:
          - "jellystat.${LOCAL_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: kube-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: *port

    persistence:
      backup:
        type: emptyDir
        globalMounts:
          - path: /app/backend/backup-data
