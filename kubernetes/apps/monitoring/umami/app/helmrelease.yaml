---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app umami
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: umami
  values:
    global:
      fullnameOverride: *app

    controllers:
      umami:
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        enabled: true
        type: deployment

        replicas: 1

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/umami-software/umami
              tag: 3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
              pullPolicy: IfNotPresent
            env:
              APP_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: umami-secrets
                    key: APP_SECRET
              DATABASE_TYPE: "postgresql"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: umami-secrets
                    key: DATABASE_URL

            probes:
              liveness:
                enabled: false

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 1Gi

    service:
      app:
        primary: true
        controller: umami
        ports:
          http:
            port: &port 3000

    route:
      internal:
        enabled: true
        kind: HTTPRoute
        hostnames: ["stats.${PUBLIC_DOMAIN}"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: umami
                port: *port
        parentRefs:
          - name: envoy-external
            namespace: kube-system
            sectionName: https
