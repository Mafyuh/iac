---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: ollama
services:
  ollama:
    image: mirror.gcr.io/ollama/ollama:0.33.2
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    restart: unless-stopped
    ports:
      - 3000:8080
    volumes:
      - open-webui:/app/backend/data
    environment:
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_PROVIDER_NAME=Authentik
      - OPENID_PROVIDER_URL=https://auth.mafyuh.io/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID
      - OAUTH_CLIENT_SECRET=$OAUTH_CLIENT_SECRET
      - OAUTH_SCOPES=openid email profile
      - OPENID_REDIRECT_URI=https://chat.mafyuh.io/oauth/oidc/callback
      - ENABLE_LOGIN_FORM=false
      - DATABASE_URL=$DATABASE_URL
    extra_hosts:
      - host.docker.internal:host-gateway

  open-terminal:
    container_name: open-terminal
    image: ghcr.io/open-webui/open-terminal:0.12.3
    restart: unless-stopped
    ports:
      - 3001:8000
    volumes:
      - open-terminal:/home
    environment:
      - OPEN_TERMINAL_API_KEY=$OPEN_TERMINAL_API_KEY
      - OPEN_TERMINAL_MULTI_USER=true

  bifrost:
    image: ghcr.io/maximhq/bifrost:v2.0.0
    container_name: bifrost
    restart: unless-stopped
    ports:
      - "4001:8080"
    volumes:
      - bifrost-data:/app/data
    environment:
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=info
      - LOG_STYLE=pretty

  ai-proxy:
    image: ghcr.io/mafyuh/ai-proxy:v1.0.0
    pull_policy: always
    restart: unless-stopped
    container_name: ai-proxy
    ports:
      - "3010:3000"
    environment:
      UPSTREAM_BASE_URL: "https://api.mafyuh.xyz"
      MODELS_DEV_URL: "https://models.dev/catalog.json"
      CATALOG_REFRESH_HOURS: "24"
#      MODEL_ALIASES_FILE: "/app/config/model-aliases.yml"

  searxng:
    image: mirror.gcr.io/searxng/searxng@sha256:8486daaebc65adacfe434be38b991cf90da92d3fd80ae9f0ab1409ba65664e28
    container_name: searxng
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/searxng:/etc/searxng
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  open-terminal:
  open-webui:
  ollama:
  bifrost-data:
