---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  ## Exporters
  speedtest-exporter:
    image: ghcr.io/miguelndecarvalho/speedtest-exporter:v3.5.4
    container_name: speedtest-exporter
    environment:
      - TZ=America/New_York
    ports:
      - 9798:9798
    restart: unless-stopped
    networks:
      - grafana

  prometheus-pve-exporter:
    init: true
    container_name: prometheus-pve-exporter
    environment:
      - PVE_USER=prometheus@pve
      - PVE_PASSWORD=${PVE_PASSWORD}
      - PVE_VERIFY_SSL=false
    ports:
      - 9221:9221
    # volumes:
    #     - /docker/appdata/pve-exporter/pve.yml:/etc/prometheus/pve.yml
    image: mirror.gcr.io/prompve/prometheus-pve-exporter:3.10.0
    restart: unless-stopped

  smokeping-prober:
    image: quay.io/superq/smokeping-prober:v0.12.0
    container_name: smokeping-prober
    restart: unless-stopped
    command:
      - "--config.file=/etc/smokeping-prober/config.yaml"
    ports:
      - 9374:9374
    volumes:
      - ./config/:/etc/smokeping-prober/

networks:
  grafana:

volumes:
  jellystat_data:
