---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  caddy:
    image: ghcr.io/homeall/caddy-reverse-proxy-cloudflare:2026.09.08
    container_name: caddy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 127.0.0.1:2019:2019
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker/appdata/caddy/data:/data
      - /docker/appdata/caddy/config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - /docker/appdata/caddy/logs:/var/log/
    environment:
      - TZ=America/New_York
      - CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/generated
    restart: unless-stopped
    networks:
      - racknerd
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  fail2ban:
    image: ghcr.io/crazy-max/fail2ban:1.1.0
    container_name: fail2ban-caddy
    network_mode: "host"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - "/docker/appdata/fail2ban-caddy/data:/data"
      - "/var/log/auth.log:/var/log/auth.log:ro"
      - "/docker/appdata/caddy/logs:/log/caddy:ro"
      - "/docker/appdata/fail2ban-caddy/f2b-logs:/f2b-logs:rw"
      - "./config/fail2ban-jail.conf:/data/jail.d/caddy.conf:ro"
      - "./config/fail2ban-action-iptables.conf:/data/action.d/iptables-custom.conf:ro"
      - "./config/caddy-auth.conf:/data/filter.d/caddy-auth.conf:ro"
      - "./config/caddy-botsearch.conf:/data/filter.d/caddy-botsearch.conf:ro"
      - "./config/caddy-limit.conf:/data/filter.d/caddy-limit.conf:ro"
    environment:
      - TZ=America/New_York
      - F2B_LOG_TARGET=/f2b-logs/fail2ban.log
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=1d
      - F2B_MAX_RETRY=3
      - SSMTP_HOST=$SSMTP_HOST
      - SSMTP_PORT=587
      - SSMTP_HOSTNAME=$SSMTP_HOSTNAME
      - SSMTP_USER=$SSMTP_USER
      - SSMTP_PASSWORD=$SSMTP_PASSWORD
      - SSMTP_TLS=YES
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "10"
    restart: unless-stopped
    depends_on:
      - caddy

  n8n:
    image: ghcr.io/n8n-io/n8n:2.39.4
    container_name: n8n
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - WEBHOOK_URL=$WEBHOOK_URL
      - N8N_ENCRYPTION_KEY=$N8N_ENCRYPTION_KEY
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=vaultwarden
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SSL_ENABLED=false
      - N8N_ENABLED_MODULES=instance-ai
      - N8N_INSTANCE_AI_MODEL=openai/gpt-5.6-terra
      - N8N_INSTANCE_AI_MODEL_URL=https://aiproxy.mafyuh.xyz/v1
      - N8N_INSTANCE_AI_MODEL_API_KEY=$N8N_INSTANCE_AI_MODEL_API_KEY
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=$N8N_SANDBOX_SERVICE_API_KEY
    restart: unless-stopped
    networks:
      - racknerd
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-api:
        condition: service_started
    labels:
      caddy: $N8N_HOSTNAME
      caddy.reverse_proxy: "{{upstreams 5678}}"

  # One-shot: generates mTLS certificates for the sandbox stack, then exits
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api@sha256:fb14de143c66aef84a2f0f81332365cd2aa2acab4140549226d8f1e533cec5ab
    container_name: sandbox-certs
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox-tls:/tls
    networks:
      - racknerd
    restart: "no"

  # Self-hosted sandbox API for n8n AI Assistant. Internal only, never expose.
  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api@sha256:fb14de143c66aef84a2f0f81332365cd2aa2acab4140549226d8f1e533cec5ab
    container_name: sandbox-api
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      - SANDBOX_API_KEYS=$N8N_SANDBOX_SERVICE_API_KEY
      - SANDBOX_API_RUNNER_REGISTRATION_TOKEN=$SANDBOX_RUNNER_REGISTRATION_TOKEN
      - SANDBOX_API_RUNNER_API_KEY=$SANDBOX_RUNNER_API_KEY
      - SANDBOX_API_GRPC_TLS_CERT_FILE=/tls/api/grpc-server.crt
      - SANDBOX_API_GRPC_TLS_KEY_FILE=/tls/api/grpc-server.key
      - SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE=/tls/api/ca.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE=/tls/api/ca.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/api/control-grpc-api-client.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/api/control-grpc-api-client.key
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME=sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - racknerd
    restart: unless-stopped

  # Privileged Docker-in-Docker runner. Internal only, never expose publicly.
  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind@sha256:a065eb3480600104a8e5bdcb23d73f7057d61dbf53f749cf4901b075612c51db
    container_name: sandbox-runner-1
    privileged: true
    depends_on:
      - sandbox-api
    environment:
      - SANDBOX_RUNNER_API_KEYS=$SANDBOX_RUNNER_API_KEY
      - SANDBOX_RUNNER_REGISTRATION_TOKEN=$SANDBOX_RUNNER_REGISTRATION_TOKEN
      - SANDBOX_RUNNER_API_GRPC_ADDR=sandbox-api:9090
      - SANDBOX_RUNNER_HTTP_BASE_URL=http://sandbox-runner-1:8080
      - SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR=:9091
      - SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR=sandbox-runner-1:9091
      - SANDBOX_RUNNER_ID=runner-1
      - SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE=ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE=/tls/runner/ca.crt
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE=/tls/runner/grpc-client.crt
      - SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE=/tls/runner/grpc-client.key
      - SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME=sandbox-api
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/runner/control-grpc-server.crt
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/runner/control-grpc-server.key
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE=/tls/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - racknerd
    restart: unless-stopped

  postgres:
    image: mirror.gcr.io/postgres:18.6
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vaultwarden
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - racknerd

  databasus:
    image: mirror.gcr.io/databasus/databasus:v3.57.0
    container_name: databasus
    volumes:
      - databasus_data:/databasus-data
    restart: unless-stopped
    networks:
      - racknerd
    labels:
      caddy: $DATABASUS_HOSTNAME
      caddy.reverse_proxy: "{{upstreams 4005}}"

  forgejo:
    image: data.forgejo.org/forgejo/forgejo:16.0.4
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=forgejo
      - GITEA__database__USER=vaultwarden
      - GITEA__database__PASSWD=$POSTGRES_PASSWORD
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      - GITEA__oauth2_client__USERNAME=preferred_username
      - GITEA__oauth2_client__UPDATE_AVATAR=true
      - GITEA__oauth2_client__OPENID_CONNECT_SCOPES=openid email profile
      - GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      - GITEA__service__DISABLE_REGISTRATION=false
    restart: always
    networks:
      - racknerd
    volumes:
      - forgejo_data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      caddy: git.mafyuh.io
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  racknerd:
    external: true

volumes:
  n8n_data:
  sandbox-tls:
  postgres_data:
  databasus_data:
  forgejo_data:
