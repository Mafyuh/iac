[Definition]

# Matches common bot/scanner patterns in Caddy JSON logs
failregex = ^.*"client_ip":"<HOST>".*"uri":".*(/\.env|/wp-admin|/admin|/phpmyadmin|/\.git|/config|/backup|/sql).*$
            ^.*"client_ip":"<HOST>".*"User-Agent":\["[^"]*[Bb]ot
            ^.*"client_ip":"<HOST>".*"User-Agent":\["[^"]*[Ss]canner
            ^.*"client_ip":"<HOST>".*"User-Agent":\["[^"]*[Cc]rawler
            ^.*"client_ip":"<HOST>".*"status":404.*"uri":".*\.(php|asp|jsp).*$

# Ignore legitimate requests
ignoreregex = ^.*"User-Agent":\["[^"]*Mozilla
              ^.*"status":200.*$
