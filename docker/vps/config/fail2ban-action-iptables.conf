[Definition]

actionstart = iptables -N f2b-<name> 2>/dev/null || true
              iptables -A f2b-<name> -j RETURN 2>/dev/null || true
              iptables -I DOCKER-USER -p tcp -m multiport --dports 80,443 -j f2b-<name> 2>/dev/null || true

actionstop = iptables -D DOCKER-USER -p tcp -m multiport --dports 80,443 -j f2b-<name> 2>/dev/null || true
             iptables -F f2b-<name> 2>/dev/null || true
             iptables -X f2b-<name> 2>/dev/null || true

actioncheck = iptables -n -L DOCKER-USER | grep -q 'f2b-<name>[ \t]'

actionban = iptables -I f2b-<name> -s <ip> -j DROP

actionunban = iptables -D f2b-<name> -s <ip> -j DROP
