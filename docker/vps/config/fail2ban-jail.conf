
[DEFAULT]
# Ban for 1 hour
bantime = 3600
# Check last 10 minutes of logs
findtime = 600
# Ban after 5 failures
maxretry = 5
action = iptables-custom
# Caddy logs "ts" as a unix epoch
datepattern = "ts":{EPOCH}
# Never ban Cloudflare edge
ignoreip = 127.0.0.1/8 ::1
