services:
  qbitty:
    cap_add:
      - NET_ADMIN
    container_name: qbitty
    environment:
      - WEBUI_PORT=8080
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=proton
      - VPN_KEEP_LOCAL_DNS=false
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_LAN_NETWORK=10.0.0.0/24,10.69.69.0/24
      - VPN_LAN_LEAK_ENABLED=false
      - VPN_FIREWALL_TYPE=auto
      - PRIVOXY_ENABLED=false
      - VPN_HEALTHCHECK_ENABLED=false
      - UNBOUND_ENABLED=false
    image: ghcr.io/hotio/qbittorrent:release-v5.2.0
    ports:
      - "8080:8080"
    restart: unless-stopped
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/ssd-appdata/appdata/qbitty:/config:rw
      - /mnt/thePool/thePoolShare:/data:rw
  sabnzbd:
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/New_York
    image: ghcr.io/linuxserver/sabnzbd:5.1.3
    ports:
      - "8082:8080"
    restart: unless-stopped
    volumes:
      - >-
        /mnt/ssd-appdata/appdata/sabnzbd/config/7zz-wrapper:/custom-cont-init.d/7zz-wrapper
      - config:/config:rw
      - /mnt/thePool/thePoolShare:/data:rw
      - >-
        /mnt/ssd-appdata/appdata/sabnzbd/config/custom-init.sh:/custom-cont-init.d/99-fix-7z.sh
volumes:
  config: Null
