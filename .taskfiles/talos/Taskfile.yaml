---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TALOS_DIR: "{{.ROOT_DIR}}/kubernetes/talos"
  SOPS_AGE_KEY_FILE: "/home/mafyuh/.sops/key.txt"

env:
  SOPS_AGE_KEY_FILE: "{{.SOPS_AGE_KEY_FILE}}"

tasks:
  build:
    desc: Render Talos configs with talstomize
    dir: "{{.TALOS_DIR}}"
    cmd: talstomize build . -o ./clusterconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/talstomize.yaml
      - which talstomize sops

  diff:
    desc: Diff rendered configs against all live nodes (read-only)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - task: build
      - export TALOSCONFIG={{.TALOSCONFIG}} && talstomize diff -f .
    preconditions:
      - which talstomize talosctl sops

  diff-node:
    desc: Diff rendered config against one live node (read-only) [NODE=required, e.g. talos-6]
    dir: "{{.TALOS_DIR}}"
    cmds:
      - task: build
      - export TALOSCONFIG={{.TALOSCONFIG}} && talstomize diff -f . --node {{.NODE}}
    requires:
      vars: [NODE]
    preconditions:
      - which talstomize talosctl sops

  diff-node-4:
    desc: Diff rendered config against node 4 (read-only)
    cmds:
      - task: diff-node
        vars:
          NODE: talos-4

  diff-node-5:
    desc: Diff rendered config against node 5 (read-only)
    cmds:
      - task: diff-node
        vars:
          NODE: talos-5

  diff-node-6:
    desc: Diff rendered config against node 6 (read-only)
    cmds:
      - task: diff-node
        vars:
          NODE: talos-6

  apply-node:
    desc: Render + apply Talos config to one node [NODE=required, e.g. talos-6]
    dir: "{{.TALOS_DIR}}"
    cmds:
      - task: build
      - export TALOSCONFIG={{.TALOSCONFIG}} && talstomize apply -f . --node {{.NODE}}
    requires:
      vars: [NODE]
    preconditions:
      - which talstomize talosctl sops

  apply-node-4:
    desc: Render + apply Talos config to node 4
    cmds:
      - task: apply-node
        vars:
          NODE: talos-4

  apply-node-5:
    desc: Render + apply Talos config to node 5
    cmds:
      - task: apply-node
        vars:
          NODE: talos-5

  apply-node-6:
    desc: Render + apply Talos config to node 6
    cmds:
      - task: apply-node
        vars:
          NODE: talos-6
