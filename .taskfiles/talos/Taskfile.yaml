---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TALOS_DIR: "{{.ROOT_DIR}}/kubernetes/talos"
  SOPS_AGE_KEY_FILE: "/home/mafyuh/.sops/key.txt"

env:
  SOPS_AGE_KEY_FILE: "{{.SOPS_AGE_KEY_FILE}}"

tasks:
  generate:
    desc: Generate Talos configuration
    dir: "{{.TALOS_DIR}}"
    cmd: talhelper genconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - which talhelper

  apply:
    desc: Apply Talos config to all nodes
    dir: "{{.TALOS_DIR}}"
    cmds:
      - talhelper genconfig
      - export TALOSCONFIG={{.TALOSCONFIG}} && talosctl apply-config --nodes 10.0.0.201 --file clusterconfig/optiplex-k8s-talos-4.yaml
      - export TALOSCONFIG={{.TALOSCONFIG}} && talosctl apply-config --nodes 10.0.0.202 --file clusterconfig/optiplex-k8s-talos-5.yaml
      - export TALOSCONFIG={{.TALOSCONFIG}} && talosctl apply-config --nodes 10.0.0.203 --file clusterconfig/optiplex-k8s-talos-6.yaml
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - which talhelper talosctl

  apply-node:
    desc: Apply Talos config to a specific node [IP=required, FILE=required]
    dir: "{{.TALOS_DIR}}"
    cmd: export TALOSCONFIG={{.TALOSCONFIG}} && talosctl apply-config --nodes {{.IP}} --file {{.FILE}}
    requires:
      vars: [IP, FILE]
    preconditions:
      - test -f {{.TALOS_DIR}}/{{.FILE}}
      - which talosctl

  apply-node-4:
    desc: Apply Talos config to node 4
    cmds:
      - task: apply-node
        vars:
          IP: 10.0.0.201
          FILE: clusterconfig/optiplex-k8s-talos-4.yaml

  apply-node-5:
    desc: Apply Talos config to node 5
    cmds:
      - task: apply-node
        vars:
          IP: 10.0.0.202
          FILE: clusterconfig/optiplex-k8s-talos-5.yaml

  apply-node-6:
    desc: Apply Talos config to node 6
    cmds:
      - task: apply-node
        vars:
          IP: 10.0.0.203
          FILE: clusterconfig/optiplex-k8s-talos-6.yaml
