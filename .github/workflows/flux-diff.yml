---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Diff"
on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  filter-changes:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@v0.7.0
        with:
          patterns: |-
            kubernetes/**/*

  flate-diff:
    name: Flate Diff
    runs-on: ubuntu-latest
    needs: filter-changes
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    env:
      FLATE_PATH: ./kubernetes/flux
    strategy:
      matrix:
        cluster_path: ["kubernetes"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup flate
        uses: home-operations/flate/action@v0.6.5
        with:
          cache: true
      - name: Test
        run: flate test all --allow-missing-secrets --path "${{ matrix.cluster_path }}"
      - name: Diff
        id: diff
        run: |
          flate diff all \
            --path "${{ matrix.cluster_path }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --allow-missing-secrets \
            --no-progress \
            -o github > diff.txt
          {
            echo 'diff<<EOF'
            cat diff.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Load Secrets
        if: ${{ steps.diff.outputs.diff != '' }}
        id: load-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          set_env: false
          secrets: |
            0f1b843b-452b-4559-b1c7-b4d700dc4d9c > GH_CLIENT_ID
            0aab8d2c-0794-42ef-9b74-b381016b8ea0 > GH_PRIVATE_KEY
      - name: Generate Token
        if: ${{ steps.diff.outputs.diff != '' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.load-secrets.outputs.GH_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GH_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Create PR Comments
        if: ${{ steps.diff.outputs.diff != '' }}
        uses: mshick/add-pr-comment@v3
        continue-on-error: true
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          message-id: "${{ github.event.pull_request.number }}/${{ matrix.cluster_path }}/flux"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
